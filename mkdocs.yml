site_name: CP Algorithms Việt Nam
site_url: https://ntanthedev.github.io/cp-algorithms/
site_description: 'Bản dịch tiếng Việt cộng đồng của Algorithms for Competitive Programming, được đồng bộ từ cp-algorithms.'
docs_dir: src
site_dir: public
use_directory_urls: false
theme:
  name: material
  language: en
  custom_dir: src/overrides
  palette:
    - scheme: cpalgo
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: favicon.ico
  favicon: favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - toc.integrate
    - search.suggest
    - content.code.copy
repo_url: https://github.com/ntanthedev/cp-algorithms
repo_name: ntanthedev/cp-algorithms
edit_uri: edit/master/src/
copyright: Text is available under the <a href="https://github.com/ntanthedev/cp-algorithms/blob/master/LICENSE">Creative Commons Attribution Share Alike 4.0 International</a> License<br/>Original content &copy; cp-algorithms contributors; Vietnamese translation &copy; Vietnamese translation contributors
extra_javascript:
  - javascript/config.js
  - javascript/sidebar-toggle-sync.js
  - https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      tex_inline_wrap: ['$', '$']
      tex_block_wrap: ['$$', '$$']
  - pymdownx.highlight
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - meta
  - toc:
      permalink: true

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: vi
          name: Tiếng Việt
          build: true
  - toggle-sidebar:
      toggle_button: all
  - mkdocs-simple-hooks:
      hooks:
          on_env: "hooks:on_env"
  - search
  - tags
  - literate-nav:
      nav_file: navigation.md
  - git-revision-date-localized:
      enable_creation_date: true
      enabled: !ENV [MKDOCS_ENABLE_GIT_REVISION_DATE, False]
  - git-authors
  - git-committers:
      repository: ntanthedev/cp-algorithms
      docs_path: src/
      token: !ENV MKDOCS_GIT_COMMITTERS_APIKEY
      enabled: !ENV [MKDOCS_ENABLE_GIT_COMMITTERS, False]
      branch: !ENV [MKDOCS_ENABLE_GIT_COMMITERS_BRANCH, master]
  - macros
  - rss:
      enabled: !ENV [MKDOCS_ENABLE_RSS_PLUGIN, False]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ntanthedev/cp-algorithms
  analytics: null
