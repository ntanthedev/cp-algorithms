name: Vietnamese translations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**/*.vi.md'
      - 'src/**/*.md'
      - 'TRANSLATING_VI.md'
      - 'scripts/check_vi_translations.py'
      - 'scripts/test_vi_review_scope.py'
      - 'scripts/check_vi_markdown_safety.py'
      - '.github/workflows/translation.yml'
  push:
    branches:
      - master
    paths:
      - 'src/**/*.vi.md'
      - 'src/**/*.md'
      - 'TRANSLATING_VI.md'
      - 'scripts/check_vi_translations.py'
      - 'scripts/test_vi_review_scope.py'
      - 'scripts/check_vi_markdown_safety.py'
      - '.github/workflows/translation.yml'

permissions:
  contents: read

concurrency:
  group: vi-translation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate translation structure
        run: python3 scripts/check_vi_translations.py

      - name: Test multi-commit review scope
        run: python3 -B scripts/test_vi_review_scope.py

      - name: Validate Vietnamese Markdown safety
        run: python3 scripts/check_vi_markdown_safety.py
