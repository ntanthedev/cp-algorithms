name: Vietnamese translation sync

on:
  pull_request:
    paths:
      - 'src/**/*.md'
      - 'scripts/check_vi_staleness.py'
      - '.github/workflows/translation-sync.yml'
  push:
    branches:
      - master
    paths:
      - 'src/**/*.md'
      - 'scripts/check_vi_staleness.py'
      - '.github/workflows/translation-sync.yml'

permissions:
  contents: read

concurrency:
  group: vi-translation-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check source hashes
        run: python scripts/check_vi_staleness.py
