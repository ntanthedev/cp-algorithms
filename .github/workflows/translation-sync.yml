name: Vietnamese translation sync

on:
  pull_request:
    paths:
      - 'src/**/*.md'
      - 'scripts/check_vi_staleness.py'
      - 'scripts/test_vi_staleness.py'
      - '.github/workflows/translation-sync.yml'
  push:
    branches:
      - master
    paths:
      - 'src/**/*.md'
      - 'scripts/check_vi_staleness.py'
      - 'scripts/test_vi_staleness.py'
      - '.github/workflows/translation-sync.yml'

permissions:
  contents: read

concurrency:
  group: vi-translation-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source hashes
        run: python3 scripts/check_vi_staleness.py

      - name: Test Git line-ending normalization
        run: python3 -B scripts/test_vi_staleness.py
