name: Test

on:
  push:
    branches:
      - master
    paths:
      - 'src/**/*.md'
      - '!src/**/*.vi.md'
      - 'test/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**/*.md'
      - '!src/**/*.vi.md'
      - 'test/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check preinstalled toolchain
        run: |
          python3 --version
          g++ --version

      - name: Run algorithm code tests
        env:
          TERM: xterm
        run: timeout 12m ./test.sh
        working-directory: test
